<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Starphase Alpha</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="node_modules/@fontsource/syncopate/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/syncopate/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/orbitron/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/orbitron/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/orbitron/800.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="titlebar"><span class="tname">STARPHASE &alpha;</span><button id="tb-min" title="Minimize">&#8212;</button><button id="tb-max" title="Maximize">&#9634;</button><button id="tb-close" class="close" title="Close">&#10005;</button></div>
<div id="game"></div>

<div id="hud">
  <canvas id="arrows"></canvas>

  <!-- HUD hardware: shells are Blender renders (tools/blender/ui_kit.py); screens are live HTML under the glass.
       Every .hud-panel is movable / scalable in Adjust UI (src/layout.js). No labels on anything. -->
  <div class="hud-panel" id="p-comms" data-title="Comms">
    <button class="mm" title="Minimize">−</button>
    <div class="pbody unit comms-unit">
      <div class="screen phos-green" id="comms-screen"><div id="comms"></div></div>
      <img class="shell" src="assets/ui/comms_unit.png" alt="" draggable="false">
      <div class="note-lamp" id="note-lamp" title=""></div>
      <button id="update-badge" class="hidden"></button>
    </div>
  </div>

  <div class="hud-panel" id="p-gauge" data-title="Ship">
    <button class="mm" title="Minimize">−</button>
    <div class="pbody unit status-unit">
      <div class="screen phos-green" id="status-screen">
        <div class="sbar" data-k="shield" data-icon="&#9960;"><div class="strack"><div class="sfill"></div></div><span class="sval"></span></div>
        <div class="sbar" data-k="armor" data-icon="&#9638;"><div class="strack"><div class="sfill"></div></div><span class="sval"></span></div>
        <div class="sbar" data-k="hull" data-icon="&#11042;"><div class="strack"><div class="sfill"></div></div><span class="sval"></span></div>
        <div class="sbar" data-k="power" data-icon="&#989;"><div class="strack"><div class="sfill"></div></div><span class="sval"></span></div>
      </div>
      <img class="shell" src="assets/ui/status_unit.png" alt="" draggable="false">
    </div>
  </div>

  <!-- main console: switches on the left, menu keys top-left over the 1–0 module tiles -->
  <div class="hud-panel" id="p-hotbar" data-title="Console">
    <button class="mm" title="Minimize">−</button>
    <div class="pbody strip console">
      <div id="toggles">
        <div class="tgl" id="tgl-ping"><div class="tlamp"></div><div class="tsw"></div></div>
        <div class="tgl" id="tgl-light"><div class="tlamp"></div><div class="tsw"></div></div>
      </div>
      <div class="c-right">
        <div id="menubtns">
          <button class="key" id="btn-status"><span class="kg">&#8801;</span></button>
          <button class="key" id="btn-char"><span class="kg">C</span></button>
          <button class="key" id="btn-inv"><span class="kg">I</span></button>
          <button class="key" id="btn-map"><span class="kg">M</span></button>
          <button class="key" id="btn-jobs"><span class="kg">J</span></button>
          <button class="key" id="btn-scan"><span class="kg">R</span></button>
        </div>
        <div id="hotbar"></div>
      </div>
    </div>
  </div>

  <div id="center-msg"></div>
  <div id="dock-prompt"></div>
</div>

<div id="adjust-bar" class="hidden">
  <span class="atitle">ADJUST UI</span>
  <span class="ahelp">Drag to move · corner: stretch (Shift = keep shape) · wheel: scale · click a panel to edit exact values</span>
  <span id="ui-edit"><b id="ui-sel">—</b>
    X <input id="ui-x" type="number" step="1"> Y <input id="ui-y" type="number" step="1">
    W% <input id="ui-w" type="number" step="1"> H% <input id="ui-h" type="number" step="1"> Z <input id="ui-z" type="number" step="1"></span>
  <button id="ui-copy">Copy layout</button>
  <button id="ui-reset">Reset layout</button>
  <button id="ui-done">Done (Esc)</button>
</div>

<div id="mainmenu" class="hidden">
  <div class="mm-title">STARPHASE <span class="alpha">&alpha;</span></div>
  <div class="mm-buttons">
    <button id="mm-play">Play</button>
    <button id="mm-settings">Settings</button>
    <button id="mm-ach">Achievements</button>
    <button id="mm-fame">Hall of Fame</button>
    <button id="mm-update">Check for updates</button>
    <button id="mm-quit">Quit</button>
  </div>
  <div class="mm-pilot" id="mm-pilot"></div>
</div>
<div id="menufade"></div>
<div id="overlay" class="hidden"></div>
<div id="crt"></div>
<div id="update-notes" class="hidden"><button id="un-close" title="Close">✕</button><div id="news"></div></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
