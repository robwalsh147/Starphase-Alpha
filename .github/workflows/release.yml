# Builds the Windows desktop app and attaches it to a GitHub Release when a version tag is pushed (e.g. v0.1.0).
# The website's "Download for Windows" button points at the latest release's zip.
name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Package + zip
        run: node tools/desktop.mjs ci
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: downloads/StarphaseAlpha-win64.zip
          name: Starphase Alpha ${{ github.ref_name }}
          body: |
            Windows desktop build of Starphase Alpha.
            Unzip anywhere and run "Starphase Alpha.exe". Or play in the browser: https://robwalsh147.github.io/Starphase-Alpha/
